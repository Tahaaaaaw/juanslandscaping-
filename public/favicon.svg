<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hcForest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3824"/>
      <stop offset="50%" stop-color="#142c1c"/>
      <stop offset="100%" stop-color="#0a170e"/>
    </linearGradient>
    <linearGradient id="hcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae288"/>
      <stop offset="45%" stop-color="#dfb846"/>
      <stop offset="100%" stop-color="#a47a20"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square / Emblem -->
  <rect width="512" height="512" rx="128" fill="url(#hcForest)"/>
  <rect x="18" y="18" width="476" height="476" rx="112" fill="none" stroke="url(#hcGold)" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Botanical Leaf on Top-Right -->
  <g filter="url(#badgeShadow)">
    <path d="M290 85 C370 70, 420 120, 410 185 C400 240, 330 235, 305 210 C280 185, 270 120, 290 85 Z" fill="url(#hcGold)" opacity="0.95"/>
    <path d="M290 85 Q335 155 400 180" fill="none" stroke="#142c1c" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- HC Typography Monogram -->
  <g filter="url(#badgeShadow)" fill="url(#hcGold)">
    <!-- Letter H -->
    <!-- Left vertical bar -->
    <rect x="80" y="145" width="46" height="235" rx="12"/>
    <!-- Right vertical bar -->
    <rect x="200" y="145" width="46" height="235" rx="12"/>
    <!-- Crossbar -->
    <rect x="80" y="240" width="166" height="46" rx="8"/>

    <!-- Letter C -->
    <path d="M430 185 C410 155, 365 140, 325 140 C255 140, 215 190, 215 262 C215 334, 255 384, 325 384 C370 384, 412 365, 432 335 C438 326, 432 315, 420 315 L385 315 C378 315, 372 320, 366 326 C354 338, 340 345, 324 345 C282 345, 260 312, 260 262 C260 212, 282 179, 324 179 C340 179, 354 186, 366 198 C372 204, 378 208, 385 208 L420 208 C432 208, 438 197, 430 185 Z"/>
  </g>

  <!-- Accent Subtext GARDENS -->
  <text x="256" y="445" font-family="'Outfit', 'Manrope', system-ui, sans-serif" font-size="36" font-weight="800" fill="url(#hcGold)" letter-spacing="6" text-anchor="middle">
    GARDENS
  </text>
</svg>
